<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Byebee Login</title>
    <link rel="stylesheet" href="nav.css">
</head>

<body style="background-color: rgb(84, 86, 66);">
    

    <div class="container">

        <div class="nav">

            <form action="home.html">

                <div class="input-group">
                    <label for="login">Name</label>
                    <input type="text" id="signup" placeholder="Enter your name" class="form" required>
                </div>
                <div class="input-group">
                    <label for="password">Phone number</label>
                    <input type="telephone" id="telephone" placeholder="Enter your phone number" class="form" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter new password" class="form" required>
                </div>



                <button type="submit" class="mid">Sign Up</button>

            </form>

        </div>

    </div>

</body>

</html>
