<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Byebee Login</title>
    <link rel="stylesheet" href="nav.css">
</head>

<body style="background-color: rgb(84, 86, 66);">

    <div class="container">

        <div class="nav">

            <div class="mar">
                <h2>Welcome to</h2>
                <h1>Buybee</h1>
            </div>

            <form action="home.html">

                <div class="input-group">
                    <label for="login">Login ID</label>
                    <input type="text" id="login" placeholder="Enter your Email or Phone" class="form" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" class="form" required>
                </div>

                <div class="forgot">
                    <button type="button">Forgot Password?</button>
                </div>

                <button type="submit" class="mid">Log In</button>

                <div>
                    <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
                </div>


            </form>

        </div>

    </div>

</body>

</html>
